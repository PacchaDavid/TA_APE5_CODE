spring.application.name=ta_ape5

# ========== CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL ==========
# URL de conexión a PostgreSQL
# La URL apunta al contenedor de Docker llamado 'postgres' en el puerto 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/ta_ape5_db
# Usuario de acceso a la base de datos
spring.datasource.username=ta_ape5_user
# Contraseña del usuario (la misma que se define en docker-compose.yml)
spring.datasource.password=ta_ape5_password
# Driver JDBC para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# ========== CONFIGURACIÓN DE JPA Y HIBERNATE ==========
# Dialecto SQL específico para PostgreSQL (mejora el desempeño y compatibilidad)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Estrategia de generación de DDL: 'update' crea/actualiza tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
# Mostrar SQL generado en los logs (útil para debugging)
spring.jpa.show-sql=false
# Formatear SQL en los logs para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true
# Usar native SQL queries cuando sea apropiado
spring.jpa.properties.hibernate.use_sql_comments=true

